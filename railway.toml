# Railway Deployment Configuration
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 app:app'"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables to set in the Railway dashboard:
# DATABASE_URL - Your PostgreSQL connection string, if using Railway Postgres
# JWT_SECRET_KEY - Your JWT secret key
# FLASK_ENV - production
